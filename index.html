<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Upgrade AI — Marketing Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-rocket"></i>
                </div>
                <div class="logo-text">
                    <span class="logo-title">The Upgrade</span>
                    <span class="logo-subtitle">Marketing Hub</span>
                </div>
            </div>
            <nav class="nav">
                <a href="#programs" class="nav-link active">Programs</a>
                <a href="#content" class="nav-link">Content</a>
                <a href="#export" class="nav-link">Export</a>
            </nav>
            <div class="header-actions">
                <button class="btn btn-ghost" id="statsBtn">
                    <i class="fas fa-chart-bar"></i>
                    <span>Stats</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Stats Panel (Hidden by default) -->
    <div class="stats-panel" id="statsPanel">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalPosts">350+</div>
                <div class="stat-label">LinkedIn Posts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalEmails">42</div>
                <div class="stat-label">Email Sequences</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalQuotes">350+</div>
                <div class="stat-label">Quotable Quotes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalStories">70</div>
                <div class="stat-label">Transformation Stories</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">7</div>
                <div class="stat-label">Program Verticals</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">140+</div>
                <div class="stat-label">Image Prompts</div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main">
        <!-- Sidebar: Programs -->
        <aside class="sidebar" id="programs">
            <h2 class="sidebar-title">Programs</h2>
            <div class="program-list" id="programList">
                <!-- Programs populated by JS -->
            </div>
        </aside>

        <!-- Content Area -->
        <section class="content-area" id="content">
            <!-- Content Type Tabs -->
            <div class="content-tabs">
                <button class="tab active" data-type="linkedin">
                    <i class="fab fa-linkedin"></i>
                    <span>LinkedIn Posts</span>
                </button>
                <button class="tab" data-type="quotes">
                    <i class="fas fa-quote-left"></i>
                    <span>Quotes</span>
                </button>
                <button class="tab" data-type="emails">
                    <i class="fas fa-envelope"></i>
                    <span>Email Sequences</span>
                </button>
                <button class="tab" data-type="stories">
                    <i class="fas fa-book-open"></i>
                    <span>Stories</span>
                </button>
                <button class="tab" data-type="playbook">
                    <i class="fas fa-file-alt"></i>
                    <span>Playbook</span>
                </button>
                <button class="tab" data-type="images">
                    <i class="fas fa-image"></i>
                    <span>Image Prompts</span>
                </button>
            </div>

            <!-- Search & Filter -->
            <div class="content-controls">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search content...">
                </div>
                <div class="filter-group">
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                    </select>
                    <button class="btn btn-secondary" id="copyAllBtn">
                        <i class="fas fa-copy"></i>
                        <span>Copy All</span>
                    </button>
                </div>
            </div>

            <!-- Content Grid -->
            <div class="content-grid" id="contentGrid">
                <!-- Content cards populated by JS -->
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading content...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Content Preview Modal -->
    <div class="modal" id="previewModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Content Preview</h3>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Preview content -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCopy">
                    <i class="fas fa-copy"></i>
                    Copy to Clipboard
                </button>
                <button class="btn btn-primary" id="modalExport">
                    <i class="fas fa-download"></i>
                    Export
                </button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal" id="exportModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Export Content</h3>
                <button class="modal-close" id="exportModalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="export-options">
                    <button class="export-option" data-format="buffer">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Buffer CSV</span>
                        <small>For social scheduling</small>
                    </button>
                    <button class="export-option" data-format="beehiiv">
                        <i class="fas fa-envelope"></i>
                        <span>Beehiiv JSON</span>
                        <small>For email automation</small>
                    </button>
                    <button class="export-option" data-format="markdown">
                        <i class="fas fa-file-alt"></i>
                        <span>Markdown</span>
                        <small>Raw content</small>
                    </button>
                    <button class="export-option" data-format="json">
                        <i class="fas fa-code"></i>
                        <span>JSON</span>
                        <small>Structured data</small>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Copied to clipboard!</span>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
